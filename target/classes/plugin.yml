name: UnstableCore
version: 1.0.0
main: com.jovanstar.unstablecore.UnstableCore
api-version: '1.21'
authors: [JovanStar]
description: Unstable KitPvP Core - AFK, Arenas, Economy, Tags, Killstreaks, Shop
softdepend: [Vault, WorldGuard, LuckPerms, PlaceholderAPI]

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.slf4j:slf4j-api:2.0.13
  - org.slf4j:slf4j-nop:2.0.13
  - org.xerial:sqlite-jdbc:3.45.3.0
  - com.mysql:mysql-connector-j:8.3.0

commands:
  unstablecore:
    description: Main UnstableCore admin command
    aliases: [ucore, uc]
    permission: unstablecore.admin
    usage: /unstablecore <arena|economy|event|reload>
  arenas:
    description: Open the FFA arena join GUI
    aliases: [arena, selectarena]
    usage: /arenas
  sword:
    description: Open the Sword FFA join GUI
    usage: /sword
  loadout:
    description: Claim your selected kit loadout (cooldown)
    usage: /loadout
  kits:
    description: Open the Unstable Kits browser
    aliases: [unstablekits]
    usage: /kits
  mapvote:
    description: Opens the map vote GUI (used internally by the clickable chat vote link)
    usage: /mapvote
  kit:
    description: Admin kit create/edit commands
    permission: unstablecore.admin
    usage: /kit <create|delete|edit|...>
  shop:
    description: Open the shop
    usage: /shop [category]
  stats:
    description: View your or another player's stats
    usage: /stats [player]
  settings:
    description: Open your settings dashboard
    aliases: [setting, options]
    usage: /settings
  rewards:
    description: Open daily / weekly / monthly rewards
    aliases: [reward, dailyrewards]
    usage: /rewards [daily|weekly|monthly]
  daily:
    description: Open daily rewards
    usage: /daily [daily|weekly|monthly]
  trash:
    description: Open the disposal GUI
    aliases: [disposal]
    usage: /trash
  disposal:
    description: Open the disposal GUI
    usage: /disposal
  killstreak:
    description: Show your current killstreak
    aliases: [ks]
    usage: /killstreak
  killstreaktoggle:
    description: Toggle killstreak titles
    aliases: [kstoggle, toggletitles]
    usage: /killstreaktoggle
  resetkillstreak:
    description: Reset your killstreak
    permission: unstablecore.killstreak.reset
    usage: /resetkillstreak
  tags:
    description: Open the tags menu
    usage: /tags
  emojitags:
    description: Open emoji tags menu
    usage: /emojitags
  ranktags:
    description: Open rank tags menu
    usage: /ranktags
  auratags:
    description: Open aura tags menu
    usage: /auratags
  bounty:
    description: Open the bounty board
    aliases: [bounties, bountiesboard, bountyboard]
    usage: /bounty [place|me|<player> [amount]]
  leaderboard:
    description: Open UnstableCore leaderboards
    aliases: [leaderboards, lb]
    usage: /leaderboard [coins|kills|biggest_killstreak|deaths|playtime|duel_wins|duel_best_streak|duel_coins_won|duel_elo|reload]
  duel:
    description: Challenge a player to a kit+map+wager duel
    usage: /duel <player|accept|deny|cancel|toggle|history|forceend>
  leave:
    description: Leave the post-duel grace period early
    usage: /leave
  dueladmin:
    description: Staff duel inspection/cleanup tools
    aliases: [duels]
    permission: unstablecore.duel.admin
    usage: /dueladmin <list|inspect|forceend|arena>

permissions:
  unstablecore.admin:
    description: Access to all UnstableCore admin commands
    default: op
  unstablecore.loadout.nocooldown:
    description: Bypass /loadout cooldown permanently
    default: false
  unstablecore.kit.nocooldown:
    description: Bypass kit /loadout cooldown permanently
    default: false
  unstablecore.vote.2x:
    description: Map votes count as 2x
    default: false
  unstablecore.booster.2x:
    description: Permanent 2x kill-coin booster (same as weekly login boost)
    default: false
  unstablecore.killstreak.reset:
    description: Reset killstreak
    default: op
  unstablecore.leaderboard.reload:
    description: Reload leaderboard config
    default: op
  unstablecore.duel:
    description: Access to /duel and /leave
    default: true
  unstablecore.duel.admin:
    description: Access to /dueladmin staff tools and /duel forceend
    default: op
  tags.emoji:
    description: Access to emoji tags
    default: false
  tags.ranks:
    description: Access to rank tags
    default: false
  tags.aura:
    description: Access to aura tags
    default: false
