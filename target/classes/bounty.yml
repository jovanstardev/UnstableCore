enabled: true
min-amount: 10
max-amount: 1000000
allow-self: false
broadcast-place: true
broadcast-claim: true
broadcast-stack: true

gui:
  board-title: "&aBOUNTY BOARD"
  place-title: "&aPlace Bounty"
  size: 54
  border: YELLOW_STAINED_GLASS_PANE
  empty: GRAY_STAINED_GLASS_PANE
  slots-per-page: 28

board:
  info-slot: 4
  place-slot: 46
  search-slot: 48
  yours-slot: 50
  prev-slot: 45
  next-slot: 52
  info-name: "&6Page {page}/{pages}"
  info-lore:
    - "&6| &fActive contracts: {count}"
    - "&6| &fHighest rewards are listed first."
  place-name: "&bPlace Bounty"
  place-lore:
    - "&f| Then select the reward."
    - "&e> Choose a target"
  search-name: "&bSearch Player"
  search-lore:
    - "&b| &fFind a specific target."
    - "&e> Search by name"
  yours-name: "&eYour Bounty"
  yours-none-lore:
    - "&e| &fNo bounty has been placed on you."
    - "&e| &fCheck back later."
    - "&e> Refresh"
  yours-active-lore:
    - "&e| &fReward: &6{amount} coins"
    - "&e| &fDefeat you to claim it."
    - "&e> Refresh"
  prev-name: "&cPrevious Page"
  prev-lore:
    - "&e> Open page {page} of {pages}."
  next-name: "&aNext Page"
  next-lore:
    - "&e> Open page {page} of {pages}."
  bounty-name: "&6#{id} {target}"
  bounty-lore:
    - "&f| Reward: &6{amount} coins"
    - "&f| Defeat {target} to claim it."

place:
  info-slot: 4
  back-slot: 45
  search-slot: 49
  next-slot: 53
  prev-slot: 45
  info-name: "&aSelect a target"
  info-lore:
    - "&a| &fClick a player head."
    - "&a| &fHighest players online are listed."
  back-name: "&cGo Back"
  back-lore:
    - "&e> Return to the bounty board."
  prev-name: "&cPrevious Page"
  prev-lore:
    - "&e> Open page {page} of {pages}."
  next-name: "&aNext Page"
  next-lore:
    - "&e> Open page {page} of {pages}."
  search-name: "&bSearch Player"
  search-lore:
    - "&b| &fBest for finding one target."
    - "&e> Type a name in chat."
  target-name: "&b{target}"
  target-none-lore:
    - "&a| &fNo current bounty."
    - "&a| &fStart one for this target."
    - "&e> Select target"
  target-active-lore:
    - "&a| &fCurrent bounty: &6{amount} coins"
    - "&a| &fAdd more to raise the reward."
    - "&e> Select target"

messages:
  disabled: "&cBounties are currently disabled."
  player-only: "&cPlayers only."
  economy: "&cEconomy is unavailable."
  invalid-amount: "&cEnter a whole number between {min} and {max}."
  not-enough: "&cYou need &e{amount} &ccoins for that bounty."
  self: "&cYou can't place a bounty on yourself."
  offline: "&cPlayer not found."
  placed: "&aPlaced a &e{amount} &acoin bounty on &f{target}&a. &7(#{id})"
  stacked: "&aAdded &e{amount} &acoins to &f{target}&a's bounty. &7Total: &e{total} &7(#{id})"
  claimed: "&aYou claimed &e{amount} &acoins from &f{target}&a's bounty!"
  claimed-broadcast: "&c☠ &8» &a{killer} &fclaimed &6{amount} &fcoins from &c{victim}&f's bounty!"
  placed-broadcast: "&c☠ &8» &a{placer} &fplaced a &6{amount} &fcoin bounty on &c{target}&f!"
  stacked-broadcast: "&c☠ &8» &a{placer} &fraised &c{target}&f's bounty by &6{amount}&f! &7Total: &e{total}"
  search-prompt: "&eType a player name in chat, or &ccancel&e."
  amount-prompt: "&eType the bounty amount for &f{target}&e (&7{min}-{max}&e), or &ccancel&e."
  cancelled: "&7Bounty input cancelled."
  not-found-search: "&cNo matching players/bounties for &f{query}&c."
  board-search-empty: "&cNo active bounties match &f{query}&c."
  none-on-you: "&7Nobody has a bounty on you."
  yours: "&eYour bounty: &6{amount} coins &7(#{id})"
