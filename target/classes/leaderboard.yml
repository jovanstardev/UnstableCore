enabled: true
cache-ttl-seconds: 45
page-size: 45
max-entries: 500
max-candidates: 500

messages:
  player-only: "&cThis command is for players only."
  usage: "&7Usage: &f/leaderboard &8| &7/leaderboard <coins|kills|biggest_killstreak|deaths|playtime>"
  reload-success: "&aLeaderboards reloaded."
  search-prompt: "&7Type a player name in chat to jump to their position. Type &ccancel &7to abort."
  search-cancelled: "&cSearch cancelled."
  search-too-short: "&cName too short."
  search-not-found: "&cNo match found."
  search-jump: "&aJumping to page &f{page}&a..."
  disabled: "&cLeaderboards are disabled."

gui:
  main:
    title: "&8Leaderboards"
    small-caps-title: true
    small-caps-menu-names: false
    size: 27
    fill-material: LIGHT_GRAY_STAINED_GLASS_PANE
    slots:
      coins: 11
      kills: 12
      biggest_killstreak: 13
      deaths: 14
      playtime: 15
  category:
    title-template: "{prefix} &8(Page {page}/{total_pages})"
    small-caps-prefix: true
    small-caps-buttons: false
    fill-material: LIGHT_GRAY_STAINED_GLASS_PANE
    slots:
      previous: 45
      back: 46
      viewer: 48
      refresh: 49
      search: 50
      next: 53
      no-economy: 22
  buttons:
    viewer:
      material: PLAYER_HEAD
      name: "&#00ffae{name}"
      lore:
        - "&f{stat_label}: &f{value_formatted} &#00ffae(#{rank})"
    previous:
      material: ARROW
      name: "&#00ffaePrevious"
      lore:
        - "&fClick to go to previous page"
    next:
      material: ARROW
      name: "&#00ffaeNext"
      lore:
        - "&fClick to go to next page"
    back:
      material: ARROW
      name: "&#00ffaeBack"
      lore:
        - "&fClick to go back"
    refresh:
      material: EMERALD
      name: "&#00ffaeRefresh"
      lore:
        - "&fClick to refresh!"
    search:
      material: OAK_SIGN
      name: "&#00ffaeSearch"
      lore:
        - "&fClick to search"
    no-economy:
      material: BARRIER
      name: "&#00ffaeNo Economy"
      lore:
        - "&fAdmin need to fix that!"

categories:
  coins:
    enabled: true
    material: GOLD_INGOT
    menu-name: "&#00ffaeCoins Leaderboard"
    menu-lore:
      - "&fClick to view the {stat_label} leaderboard"
    detail-prefix: "&8Most Coins"
    stat-label: "Coins"
    head-name: "&#00ffae{name}"
    head-lore:
      - "&f{stat_label}: &f{value_formatted} &#00ffae(#{rank})"
  kills:
    enabled: true
    material: DIAMOND_SWORD
    menu-name: "&#00ffaeKills Leaderboard"
    menu-lore:
      - "&fClick to view the {stat_label} leaderboard"
    detail-prefix: "&8Most Kills"
    stat-label: "Kills"
    head-name: "&#00ffae{name}"
    head-lore:
      - "&f{stat_label}: &f{value_formatted} &#00ffae(#{rank})"
  biggest_killstreak:
    enabled: true
    material: NETHER_STAR
    menu-name: "&#00ffaeBiggest Killstreak"
    menu-lore:
      - "&fClick to view the {stat_label} leaderboard"
    detail-prefix: "&8Biggest Killstreak"
    stat-label: "Best Streak"
    head-name: "&#00ffae{name}"
    head-lore:
      - "&f{stat_label}: &f{value_formatted} &#00ffae(#{rank})"
  deaths:
    enabled: true
    material: SKELETON_SKULL
    menu-name: "&#00ffaeDeaths Leaderboard"
    menu-lore:
      - "&fClick to view the {stat_label} leaderboard"
    detail-prefix: "&8Most Deaths"
    stat-label: "Deaths"
    head-name: "&#00ffae{name}"
    head-lore:
      - "&f{stat_label}: &f{value_formatted} &#00ffae(#{rank})"
  playtime:
    enabled: true
    material: CLOCK
    menu-name: "&#00ffaePlaytime Leaderboard"
    menu-lore:
      - "&fClick to view the {stat_label} leaderboard"
    detail-prefix: "&8Most Playtime"
    stat-label: "Playtime"
    head-name: "&#00ffae{name}"
    head-lore:
      - "&f{stat_label}: &f{value_formatted} &#00ffae(#{rank})"
