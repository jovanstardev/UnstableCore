enabled: true

request:
  timeout-seconds: 30
  cooldown-seconds: 5
  rate-limit-seconds: 3

countdown-seconds: 3
# 5 minutes - if nobody dies by then it's a draw, both refunded and teleported back.
max-duration-seconds: 300
# refund = both wagers refunded, no winner recorded (draw) | higher-health = whoever has more HP wins
max-duration-outcome: refund
grace-period-seconds: 0

wager:
  min: 0
  max: 1000000
  daily-limit: 0
  min-account-age-days: 0
  min-playtime-minutes: 0

no-wager-reward: 25
house-cut-percent: 0

rematch:
  enabled: true
  text: "&eWant a rematch against &f{opponent}&e? "
  button: "&6&l[REMATCH]"
  hover: "&eClick to challenge &f{opponent} &eto a rematch!"

ranked:
  enabled: true
  default-elo: 1000
  k-factor: 32

# Flags suspicious ranked-duel patterns for staff review (/dueladmin flags) - never auto-punishes.
anti-farm:
  enabled: true
  window-minutes: 30
  max-duels-per-window: 5
  alternating-threshold: 4

queue:
  enabled: true
  match-interval-ticks: 20

spectate:
  enabled: true

scoreboard:
  enabled: true
  title: "&d&l⚔ DUEL"

default-kit: law

arenas:
  - duel1
  - duel2

announcements:
  enabled: true
  min-wager: 0
  broadcast: "&8[&d⚔&8] &f{winner} &7defeated &f{loser}&7."
  broadcast-wager: "&8[&d⚔&8] &f{winner} &7defeated &f{loser} &7for &6{pot} coins&7."

# Commands blocked while a duel is ACTIVE (label only, no leading slash).
restricted-commands:
  - spawn
  - warp
  - home
  - tpa
  - tpaccept
  - tpahere
  - tp
  - back

fight-action-bar-duration-ms: 5000

gui:
  border: MAGENTA_STAINED_GLASS_PANE
  filler: GRAY_STAINED_GLASS_PANE
  map-material: FILLED_MAP
  map-name: "&d&l{map}"
  map-lore-available:
    - "&8&m                                "
    - "&a✔ &fAvailable"
    - "&7Click to select this arena"
  map-lore-unavailable:
    - "&8&m                                "
    - "&c✘ &f{reason}"
  target-online-lore:
    - "&8&m                                "
    - "&a● &fOnline &7- ready to duel"
  target-offline-lore:
    - "&8&m                                "
    - "&c● &fOffline &7- can't send a request"

messages:
  disabled: "&cDuels are currently disabled."
  player-only: "&cPlayers only."
  usage: "&cUsage: /duel <player>"
  self-duel: "&cYou can't duel yourself."
  target-offline: "&cThat player isn't online."
  target-opted-out: "&cThat player isn't accepting duel requests."
  already-in-duel: "&cYou're already in a duel."
  target-already-in-duel: "&c{target} is already in a duel."
  target-busy: "&c{target} can't be challenged right now."
  challenger-busy: "&cYou can't do that right now (combat-tagged, dead, or busy)."
  queue-in-arena: "&cYou cannot join the queue while inside an arena."
  duplicate-request: "&cYou already have a pending request with {target}."
  on-cooldown: "&cYou must wait {seconds}s before challenging {target} again."
  rate-limited: "&cYou're sending requests too quickly - wait a moment."
  no-arenas-configured: "&cNo duel arenas are configured."
  arena-unavailable: "&cThat arena is no longer available - pick another."
  wager-too-low: "&cMinimum wager is &e{min} &ccoins."
  wager-too-high: "&cMaximum wager is &e{max} &ccoins."
