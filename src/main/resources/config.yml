  interval-seconds: 900
  warnings: [30, 15, 5, 3, 2, 1]
  warning-message: "<b><gradient:#A100FF:#E9D5FF>UNSTABLE FFA</gradient></b> &8» &fDropped items will be cleared in <#A100FF>{seconds}s &f!"
  cleared-message: "<b><gradient:#A100FF:#E9D5FF>UNSTABLE FFA</gradient></b> &8» &fDropped items have been &acleared&f."

