    - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  start-sound: ENTITY_PLAYER_LEVELUP
  end-sound: BLOCK_NOTE_BLOCK_BASS
  bossbar:
