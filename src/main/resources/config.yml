arena:
  rotate-interval-seconds: 7200
  rotate-broadcast: "<b><gradient:#A100FF:#E9D5FF>UNSTABLE KITPVP</gradient></b> &8» &fMap is rotated and new map is &a{map}"
  rotate-sound: UI_TOAST_CHALLENGE_COMPLETE
  rotate-transfer-players: true
  vote:
    enabled: true
    lead-seconds: 60
    duration-seconds: 45
    max-maps: 4
    double-vote-permission: "unstablecore.vote.2x"
    double-vote-weight: 2
    refresh-ticks: 20
    end-broadcast: "<b><gradient:#A100FF:#E9D5FF>UNSTABLE KITPVP</gradient></b> &8» &fVote ended - next map is &a{map} &8(&f{percent}%&8)"
    voted-message: "&aVoted for &f{map} &8(&f{percent}%&8)&a."
    not-in-arena: "&cYou must be inside the arena to vote for the next map."
  rtp-max-attempts: 120
  rtp-cache-size: 48
  rtp-min-spot-distance: 12
  rtp-avoid-recent-distance: 18
  rtp-recent-memory: 8
  rtp-min-support-depth: 2
  rtp-roof-air-needed: 3
  rtp-clearance-above: 6
  rtp-require-sky-light: true
  rtp-border-padding: 2
  teleport-title: "&a&l{map}"
  teleport-subtitle: "&fYou are teleported to arena"
  teleport-title-seconds: 2
  teleport-sound: ITEM_MACE_SMASH_GROUND_HEAVY
  teleport-sound-key: "minecraft:item.mace.smash_ground_heavy"
  teleport-sound-volume: 1.0
  teleport-sound-pitch: 1.0
  max-nomace-arenas: 2
  rotate-mace-only: true
  # Cap on remembered player-placed blocks inside arenas. Oldest entries are evicted first.
  max-placed-blocks: 50000
  newbie:
    enabled: true
    type: nomace
    display-name: "<#55FFFF>&lNewbie Arena &8» &fUnder 6h"

