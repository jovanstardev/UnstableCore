prefix: "<#FF9C59>&lUUFFA &8• &7"

database:
  type: sqlite
  pool-size: 4
  migrate-from-yaml: true
  sqlite:
    file: data.db
  mysql:
    host: localhost
    port: 3306
    database: unstablecore
    username: root
    password: ""
    params: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"

newbie-hours: 6

# How long a chat prompt (duel wager, bounty amount, leaderboard search) keeps capturing
# what the player types before it gives up. Without a limit, a prompt the player never
# answered would swallow their chat for the rest of the session.
chat-prompt-timeout-seconds: 60

kill-reward: 10

combat-sounds:
  hit:
    enabled: true
    sound: ENTITY_PLAYER_ATTACK_STRONG
    volume: 1.0
    pitch: 1.0
    cooldown-ms: 80
  kill:
    enabled: true
    sound: ENTITY_WITHER_SPAWN
    volume: 1.0
    pitch: 1.0

combat-tag:
  enabled: true
  seconds: 15

killstreak:
  title-seconds: 2
  title-minimum: 2
  sound: ENTITY_PLAYER_LEVELUP
  sound-volume: 1.0
  sound-pitch: 1.5
  streak-end-minimum: 2
  milestones:
    enabled: true
    values: [5, 10, 15, 20, 25, 50, 100]
  # Announcer voice lines on killstreak milestones. Fires only on the milestone values above,
  # picking the highest tier the streak has reached: 5-9 announce mega kill, 10+ monster kill.
  #
  # "sound" is a resource-pack key (see the resourcepack/ folder and its README). Players without
  # the pack silently ignore it, so "fallback" - a normal vanilla sound - is played to everyone
  # and the voice just layers on top for those who have the pack. Nothing breaks either way.
  announcer:
    enabled: true
    # Sound slider the voice obeys. MASTER is always audible; PLAYERS respects that slider.
    category: MASTER
    # Sends the announcer pack as an ADDITIONAL pack on join, stacked on top of any pack another
    # plugin already applies (ItemsAdder, SkinVault). Use this instead of server.properties on a
    # server that already serves a pack - server.properties holds only one, so setting it there
    # makes the two packs replace each other.
    #
    # Leave url blank to disable. sha1 must be the 40-character hash of the uploaded zip; if it
    # does not match, clients re-download every join or refuse the pack.
    resource-pack:
      url: ""
      sha1: ""
      prompt: "&dUnstable &fAnnouncer &7- adds killstreak voice lines"
      required: false
    tiers:
      5:
        sound: "unstable:announcer.mega_kill"
        fallback: ENTITY_ENDER_DRAGON_GROWL
        volume: 1.0
        pitch: 1.0
        # false = only the player who got the streak hears it
        broadcast: false
      10:
        sound: "unstable:announcer.monster_kill"
        fallback: ENTITY_WITHER_SPAWN
        volume: 1.0
        pitch: 1.0
        # true = the whole server hears it (players who muted streak alerts are skipped)
        broadcast: true

kill-messages:
  enabled: true
  icon: "&c☠"
  kill: "{icon} &8» &c{victim} &fwas killed by &a{killer}"
  streak-end: "{icon} &c&lSTREAK &8» &a{killer} &fended &c{victim}'s &c{streak} &fkill streak"
  milestone: "{icon} &c&lSTREAK &8» &f{killer} &freached &c{streak} &fkills!"
  death: "{icon} &8» &c{victim} &fdied"
  suicide: "{icon} &8» &c{victim} &fkilled themselves"

