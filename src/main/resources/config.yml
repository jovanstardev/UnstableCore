    size: 27
    filler: GRAY_STAINED_GLASS_PANE
    join-slot: 13
    join-material: LIME_DYE
    join-name: "&a&lᴊᴏɪɴ ꜱᴡᴏʀᴅ ꜰꜰᴀ"
    join-lore:
      - "&r"
      - "&fᴍᴏᴅᴇ: &aSword FFA"
      - "&fᴘʟᴀʏᴇʀꜱ ɪɴꜱɪᴅᴇ: {players}"

sword:
  arena-id: ""

loadout:
  cooldown-seconds: 1800
  # Re-gear a player on respawn when they have a completely empty inventory.
  # Never touches a non-empty inventory. Set to false to disable respawn re-gearing entirely.
  give-on-respawn: true
  # What that respawn re-gear hands out:
  #   default  - the free starter kit (kits.default-kit below, normally "law"). Ignores and does
  #              not consume cooldown-seconds, because that kit is free to claim anyway.
  #   none     - nothing; players respawn empty and must claim a kit themselves.
  #   selected - the player's own selected kit, gated on and consuming cooldown-seconds.
  # Leave this on "default". With "selected", a player whose cooldown has lapsed gets their
  # premium kit back every time they die, which makes dying a faster way to re-gear than
  # waiting out the cooldown and defeats the point of having one.
  respawn-kit: default

held-shulker:
  enabled: true
  title: "&dShulker Box"

# Set enabled to false on a server that runs a dedicated duels plugin (ZelDuels and the like).
# The duel managers are never created and /duel, /dueladmin, /duels, /spec and /leave are
# unregistered on startup, so the other plugin claims those names cleanly. Duel leaderboard
# categories render empty. Everything else - kits, arenas, bounty, shop, killstreaks - is
# unaffected.
duels:
  enabled: true

kits:
  unlock-by-permission: false
  default-kit: law

kit-rank:
  member-prefix: "&f&lMEMBER "
  tab-weight-max: 49
