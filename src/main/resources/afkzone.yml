enabled: true
region: afk
# Restrict the AFK zone to one world by name, or leave blank for any world. This shipped as
# "spawn1", a world that does not exist on a fresh install, so the region never matched and the
# whole AFK reward system silently did nothing until an admin noticed.
world: ""
tick-seconds: 5
reward-interval: 300
default-reward: 5

rewards:
  - permission: group.monarch
    amount: 15
  - permission: group.unstable+
    amount: 10
  - permission: group.flame
    amount: 10
  - permission: group.bird
    amount: 10
  - permission: group.media
    amount: 10
  - permission: group.pirate
    amount: 5

require-water: true

messages:
  enter:
    - ""
    - "<#FF9C59>&lUUFFA &8• &7You are now earning coins!"
    - "&7&oStay for {minutes} minutes in water to receive your reward of &f{amount} Coins&7&o."
    - ""
  leave: "<#FF9C59>&lUUFFA &8• &7You left the zone. Progress reset."
  reward: "<#FF9C59>&l+{amount} &lCOINS &8• &7AFK Reward received!"
  actionbar: "&e&lAFK ZONE &8| &fReward: &e{amount} &8| &fProgress: &e{progress}s &7/ &e{interval}s"
