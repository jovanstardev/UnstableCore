
enabled: true
timezone: ""

booster:
  multiplier: 2.0
  permission: "unstablecore.booster.2x"

gui:
  size: 54
  border: PURPLE_STAINED_GLASS_PANE
  filler: GRAY_STAINED_GLASS_PANE
  tabs:
    daily:
      slot: 1
      material: CLOCK
      name: "&6DAILY"
      lore-current: "&7CURRENT TAB"
      lore-switch: "&eCLICK TO SWITCH"
    weekly:
      slot: 4
      material: BOOK
      name: "&dWEEKLY"
      lore-current: "&7CURRENT TAB"
      lore-switch: "&eCLICK TO SWITCH"
    monthly:
      slot: 7
      material: NETHER_STAR
      name: "&bMONTHLY"
      lore-current: "&7CURRENT TAB"
      lore-switch: "&eCLICK TO SWITCH"
  booster-info:
    slot: 40
    active-material: EXPERIENCE_BOTTLE
    active-name: "&6ACTIVE COIN BOOSTER"
    active-lore:
      - "&fTIME LEFT: &e{time}"
      - "&7KILL COINS x&e{multiplier}"
    permission-material: EXPERIENCE_BOTTLE
    permission-name: "&6ACTIVE COIN BOOSTER"
    permission-lore:
      - "&fSOURCE: &ePermission"
      - "&7KILL COINS x&e{multiplier}"
    inactive-material: GLASS_BOTTLE
    inactive-name: "&7NO ACTIVE BOOSTER"
    inactive-lore:
      - "&8CLAIM A DAY 7 OR 30-DAY MILESTONE"
      - "&8TO ACTIVATE A COIN BOOSTER."

daily:
  title: "&6DAILY REWARDS"
  streak:
    slot: 13
    material: SUNFLOWER
    name: "&e☀ DAILY STREAK"
    lore:
      - "&7STREAK: &e{streak} {streak-label}"
      - "&7BEST EVER: &e{best}"
      - "&7TODAY: &f{today}"
  footer:
    slot: 49
    material: EMERALD
    name: "&aDAILY CYCLE"
    lore:
      - "&7CLAIM DAYS 1→7 IN A ROW."
      - "&7MISS A DAY AND YOU RESTART AT DAY 1."
  name-locked: "&cDAY {day}"
  name-claimed: "&7DAY {day}"
  name-claimable: "&aCLAIM DAY {day}"
  lore:
    - "&7REWARD: &e{coins} COINS"
    - "&6+ {booster-hours}H COIN BOOSTER"
  lore-claimable:
    - "&aCLAIM DAY {day}"
    - "&aCLICK TO CLAIM"
  lore-claimed:
    - "&a✓ CLAIMED"
  lore-locked:
    - "&c🔒 LOCKED"
  days:
    1:
      slot: 19
      material: IRON_NUGGET
      coins: 20
      booster-hours: 0
    2:
      slot: 20
      material: IRON_INGOT
      coins: 20
      booster-hours: 0
    3:
      slot: 21
      material: GOLD_NUGGET
      coins: 30
      booster-hours: 0
    4:
